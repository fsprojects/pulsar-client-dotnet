name: .NET Core Ubuntu

on: [pull_request, push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Up standalone docker-composer
      run: |
        cd tests/compose/standalone
        docker compose up -d

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.100'
        include-prerelease: true

    - name: Install dotnet tools locally
      run: dotnet tool restore

    - name: Dotnet Restore
      run: dotnet restore

    - name: Dotnet Build Release
      run: dotnet build -c Release --no-restore

    - name: Apt-get Install Snappy & ZSTD
      run: |
        sudo apt-get install -y libsnappy-dev
        sudo apt-get install -y libzstd-dev

    - name: Run Unit Tests
      run: |
        cd tests/UnitTests
        dotnet run -c Release --no-build

    - name: docker-compose status
      run: |
        cd tests/compose/standalone
        docker compose ps
        docker compose logs init

    - name: Run Integration Tests
      timeout-minutes: 3
      run: |
        dotnet tool install --tool-path "$RUNNER_TEMP/pulsar-diagnostics" dotnet-stack
        cd tests/IntegrationTests
        dotnet bin/Release/net10.0/IntegrationTests.dll --no-spinner --debug &
        test_pid=$!
        (
          sleep 75
          if kill -0 "$test_pid" 2>/dev/null; then
            echo "Integration tests are still running; collecting managed thread stacks."
            timeout 30s "$RUNNER_TEMP/pulsar-diagnostics/dotnet-stack" report --process-id "$test_pid"
          fi
        ) &
        watchdog_pid=$!
        set +e
        wait "$test_pid"
        test_exit=$?
        kill "$watchdog_pid" 2>/dev/null
        wait "$watchdog_pid" 2>/dev/null
        exit "$test_exit"
